[settings]
state_dir = '../runtime'
refresh_before_seconds = 1800
timeout_seconds = 30
max_pages = 10000

[mysql]
host = '127.0.0.1'
port = 3306
database = 'source_data'
user = 'collector'
password = 'REPLACE_WITH_DATABASE_PASSWORD'

# Tables must already exist with the documented columns and unique keys.
[mysql.tables]
stats = 'zhongan_stats'
orders = 'zhongan_orders'
audit = 'collector_run'

[auth]
source = 'zhongan'
browser_channel = 'chrome'
auth_cookie_names = ['REPLACE_WITH_VERIFIED_AUTH_COOKIE_NAME']
