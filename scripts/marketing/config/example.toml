[settings]
state_dir = '../runtime'
refresh_before_seconds = 1800
timeout_seconds = 30
max_pages = 10000

[mysql]
host = '127.0.0.1'
port = 3306
database = 'source_data'
user = 'collector'
password_env = 'MARKETING_MYSQL_PASSWORD'

[auth]
source = 'marketing'
env_prefix = 'MARKETING_'
