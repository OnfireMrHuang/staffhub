# 飞书接入模板：先 inspect-sources，再按真实表头替换所有 REPLACE 占位符。
[settings]
state_dir = '../runtime'
refresh_before_seconds = 1800
alert_cooldown_seconds = 1800
timeout_seconds = 30
max_pages = 10000
on_error = 'continue'
alert_on_error = false

[mysql]
host = '127.0.0.1'
port = 3306
database = 'live_data'
user = 'live_data'
password_env = 'LIVE_MYSQL_PASSWORD'

[credentials.marketing_app]
source = 'marketing'
env_prefix = 'LIVE_MARKETING_'
# env_file = 'credentials.env' # 可选；路径相对本 TOML，进程环境变量优先

[credentials.qianchuan_app]
source = 'qianchuan'
env_prefix = 'LIVE_QIANCHUAN_'

[credentials.pingan_login]
source = 'pingan'
browser_channel = 'chrome'
token_storage = 'cookie' # 或 localStorage
# 必须从已登录页面确认实际键名，示例值不能直接用于生产
 token_key = 'REPLACE_WITH_VERIFIED_TOKEN_KEY'

[credentials.zhongan_login]
source = 'zhongan'
browser_channel = 'chrome'
# 实际认证 Cookie 名，不能填写统计/追踪 Cookie
 auth_cookie_names = ['REPLACE_WITH_VERIFIED_AUTH_COOKIE_NAME']

[sms]
enabled = false
region = 'ap-guangzhou'
secret_id_env = 'TENCENTCLOUD_SECRET_ID'
secret_key_env = 'TENCENTCLOUD_SECRET_KEY'
sdk_app_id = 'REPLACE_ME'
sign_name = '替换为审核通过的签名'
template_id = 'REPLACE_ME'
phone_numbers = ['+8613800000000'] # 演示号码，启用前替换为管理员真实号码
# 必须对应腾讯云已审核模板的变量顺序和数量
 template_params = ['{source}', '{error}', '{minutes}']

# 表名取自可见工作表标签；所有列名和ID待实际校准，不猜测 sheet_id。
[master_data]
mode = 'feishu'
workbook_token = 'Chk0sVIOIh8OyjtOyiHceWxKnnb'
token_env = 'FEISHU_ACCESS_TOKEN'

[master_data.tables.accounts]
title = '产品账户信息'
[master_data.tables.accounts.columns]
product_id = 'REPLACE_WITH_PRODUCT_ID_HEADER'
room_id = 'REPLACE_WITH_ROOM_ID_HEADER'
advertiser_id = 'REPLACE_WITH_ADVERTISER_ID_HEADER'
account_name = 'REPLACE_WITH_ACCOUNT_NAME_HEADER'
account_type = 'REPLACE_WITH_ACCOUNT_TYPE_HEADER'
stat_platform = 'REPLACE_WITH_STAT_PLATFORM_HEADER'
aweme_id = 'REPLACE_WITH_AWEME_ID_HEADER'
app_id = 'REPLACE_WITH_APP_ID_HEADER'

[master_data.tables.applications]
title = '巨量引擎应用信息'
[master_data.tables.applications.columns]
app_id = 'REPLACE_WITH_APP_ID_HEADER'
source = 'REPLACE_WITH_SOURCE_HEADER'

[master_data.tables.backends]
title = '产品统计后台信息'
[master_data.tables.backends.columns]
product_id = 'REPLACE_WITH_PRODUCT_ID_HEADER'
room_id = 'REPLACE_WITH_ROOM_ID_HEADER'
source = 'REPLACE_WITH_SOURCE_HEADER'
selector = 'REPLACE_WITH_SELECTOR_HEADER'

[master_data.application_credentials]
'marketing:REPLACE_WITH_MARKETING_APP_ID' = 'marketing_app'
'qianchuan:REPLACE_WITH_QIANCHUAN_APP_ID' = 'qianchuan_app'

[master_data.backend_credentials]
'pingan:REPLACE_WITH_CHANNEL' = 'pingan_login'
'zhongan:REPLACE_WITH_DY_NO' = 'zhongan_login'
