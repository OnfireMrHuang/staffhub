# 实际工作簿接入模板；仅含非敏感映射。APP_SECRET/登录态须由私有环境配置。
[settings]
state_dir = '../runtime'
refresh_before_seconds = 1800
alert_cooldown_seconds = 1800
timeout_seconds = 30
max_pages = 10000
on_error = 'continue'
alert_on_error = false

[mysql]
host = '127.0.0.1'
port = 3306
database = 'live_data'
user = 'live_data'
password_env = 'LIVE_MYSQL_PASSWORD'

[credentials.marketing_app]
source = 'marketing'
env_prefix = 'LIVE_MARKETING_'
# env_file = 'credentials.env' # 可选；路径相对本 TOML，进程环境变量优先

[credentials.qianchuan_app]
source = 'qianchuan'
env_prefix = 'LIVE_QIANCHUAN_'

# 每个后台使用独立浏览器配置目录；真实认证键需从实际登录页核对。
[credentials.pingan_room_1]
source = 'pingan'
browser_channel = 'chrome'
token_storage = 'cookie'
token_key = 'REPLACE_WITH_VERIFIED_TOKEN_KEY'
[credentials.pingan_room_2]
source = 'pingan'
browser_channel = 'chrome'
token_storage = 'cookie'
token_key = 'REPLACE_WITH_VERIFIED_TOKEN_KEY'
[credentials.zhongan_windmill]
source = 'zhongan'
browser_channel = 'chrome'
auth_cookie_names = ['REPLACE_WITH_VERIFIED_AUTH_COOKIE_NAME']
[credentials.zhongan_cart]
source = 'zhongan'
browser_channel = 'chrome'
auth_cookie_names = ['REPLACE_WITH_VERIFIED_AUTH_COOKIE_NAME']

[sms]
enabled = false
region = 'ap-guangzhou'
secret_id_env = 'TENCENTCLOUD_SECRET_ID'
secret_key_env = 'TENCENTCLOUD_SECRET_KEY'
sdk_app_id = 'REPLACE_ME'
sign_name = '替换为审核通过的签名'
template_id = 'REPLACE_ME'
phone_numbers = ['+8613800000000'] # 演示号码，启用前替换为管理员真实号码
# 必须对应腾讯云已审核模板的变量顺序和数量
 template_params = ['{source}', '{error}', '{minutes}']

[master_data]
mode = 'xlsx'
workbook_file = '../第一期试点直播间产品.xlsx'

[master_data.tables.accounts]
title = '产品账户信息'
[master_data.tables.accounts.columns]
product_id = 'product_id'
room_id = 'room_id'
product_name = 'product_name'
room_name = 'room_name'
advertiser_id = 'advertiser_id'
account_name = 'account_name'
account_type = 'account_type'
stat_platform = 'stat_platform'
app_id = 'app_id'
account_scope = 'account_scope'
aweme_id = 'aweme_id'

[master_data.tables.applications]
title = '巨量引擎应用信息'
[master_data.tables.applications.columns]
app_id = 'app_id'
source = 'source'

[master_data.tables.backends]
title = '产品统计后台信息'
[master_data.tables.backends.columns]
product_id = 'product_id'
room_id = 'room_id'
product_name = 'product_name'
room_name = 'room_name'
source = 'source'
selector = 'selector'
platform = 'platform'

